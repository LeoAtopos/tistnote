plugins { id 'com.android.application' }

android {
    namespace 'app.tistnote.android'
    compileSdk 35
    defaultConfig { applicationId 'app.tistnote.android'; minSdk 26; targetSdk 35; versionCode 4; versionName '0.2.0' }
    signingConfigs {
        release {
            if (System.getenv('TISTNOTE_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('TISTNOTE_ANDROID_KEYSTORE'))
                storePassword System.getenv('TISTNOTE_ANDROID_STORE_PASSWORD')
                keyAlias 'tistnote'
                keyPassword System.getenv('TISTNOTE_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main.assets.srcDir(rootProject.file('../dist-android')) }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    testImplementation 'junit:junit:4.13.2'
}
